
name: Build Apgreider APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ApgreiderAndroid-project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o ApgreiderAndroid-project.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p extracted/apgreider_android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Apgreider-APK
          path: extracted/apgreider_android/app/build/outputs/apk/debug/app-debug.apk
