name: Build Apgreider APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'apgreider-upgrade-v5.html'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'ApgreiderAndroid-project*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Archive not found!"
            exit 1
          fi
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Replace app with V5
        run: |
          cp apgreider-upgrade-v5.html extracted/apgreider_android/app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p extracted/apgreider_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apgreider-V5-APK
          path: extracted/apgreider_android/app/build/outputs/apk/debug/app-debug.apk
